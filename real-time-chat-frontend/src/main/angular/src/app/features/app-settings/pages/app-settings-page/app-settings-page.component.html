<div class="page">
  <h1 class="page-title">{{ text.TITLE }}</h1>

  <form class="form-card" (submit)="$event.preventDefault(); save()">
    <label class="field">
      <span class="field-label">{{ text.THEME_LABEL }}</span>
      <select
        class="input-text"
        [ngModel]="settings().theme"
        name="theme"
        (ngModelChange)="updateField('theme', $event)"
      >
        <option value="light">{{ text.THEME_LIGHT }}</option>
        <option value="dark">{{ text.THEME_DARK }}</option>
      </select>
    </label>

    <label class="field">
      <span class="field-label">{{ text.SERVER_URL_LABEL }}</span>
      <input
        class="input-text"
        [ngModel]="settings().serverUrl"
        name="serverUrl"
        (ngModelChange)="updateField('serverUrl', $event)"
      />
    </label>

    <button class="save-btn" type="submit" [disabled]="isSaving()">
      {{ text.SAVE_BUTTON }}
    </button>

    <p class="status" *ngIf="statusMessage() as status">{{ status }}</p>
  </form>
</div>
